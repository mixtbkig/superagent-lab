<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="mechTitle mechDesc">
  <title id="mechTitle">superagent 内部机制</title>
  <desc id="mechDesc">时序图：人在 GitHub 创建 issue 并 @agent，GitHub 把 trigger 交给 superagent；superagent 评估请求、建立 ticket，把任务派发给 worker；worker 推送分支、打开 PR 并回到 issue 回复。</desc>
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c18"/>
      <stop offset="0.55" stop-color="#0c1428"/>
      <stop offset="1" stop-color="#070c18"/>
    </linearGradient>
    <pattern id="mgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
    <radialGradient id="mglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mglow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8ea3c4"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/>
    </marker>
    <clipPath id="mround">
      <rect width="1200" height="460" rx="24"/>
    </clipPath>
    <style>
      .dash { stroke-dasharray: 5 7; animation: dash 1.8s linear infinite; }
      .float { animation: float 7s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @media (prefers-reduced-motion: reduce) { .dash, .float { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#mround)">
    <rect width="1200" height="460" fill="url(#mbg)"/>
    <rect width="1200" height="460" fill="url(#mgrid)"/>
    <ellipse cx="120" cy="20" rx="320" ry="200" fill="url(#mglow)"/>
    <ellipse cx="1080" cy="440" rx="320" ry="200" fill="url(#mglow2)"/>

    <!-- 标题 -->
    <text x="56" y="64" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#e6edf7">内部机制</text>
    <text x="56" y="92" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ea3c4">一次请求如何在 superagent 里流转</text>
    <text x="1144" y="60" text-anchor="end" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#67e8f9">TRIGGER → TICKET → PR</text>

    <!-- 生命线 -->
    <g stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="3 7">
      <line x1="120" y1="160" x2="120" y2="414"/>
      <line x1="420" y1="160" x2="420" y2="414"/>
      <line x1="720" y1="160" x2="720" y2="414"/>
      <line x1="1020" y1="160" x2="1020" y2="414"/>
    </g>

    <!-- 泳道头 -->
    <g class="float">
      <rect x="75" y="116" width="90" height="44" rx="12" fill="#f472b6" fill-opacity="0.08" stroke="#f472b6" stroke-opacity="0.35"/>
      <text x="120" y="138" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#f9a8d4">人</text>
      <text x="120" y="153" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#c9a6bb">提需求 / review</text>
    </g>
    <g class="float" style="animation-delay: -1.2s">
      <rect x="340" y="116" width="160" height="44" rx="12" fill="#e6edf7" fill-opacity="0.05" stroke="#e6edf7" stroke-opacity="0.22"/>
      <text x="420" y="138" text-anchor="middle" font-family="'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf7">GitHub</text>
      <text x="420" y="153" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#8ea3c4">issue / PR</text>
    </g>
    <g class="float" style="animation-delay: -2.4s">
      <rect x="640" y="116" width="160" height="44" rx="12" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.35"/>
      <text x="720" y="138" text-anchor="middle" font-family="'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#a5f3fc">superagent</text>
      <text x="720" y="153" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#8ea3c4">编排 / 授权 / 订阅</text>
    </g>
    <g class="float" style="animation-delay: -3.6s">
      <rect x="940" y="116" width="160" height="44" rx="12" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="1020" y="138" text-anchor="middle" font-family="'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#c4b5fd">worker</text>
      <text x="1020" y="153" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#8ea3c4">独立 worktree</text>
    </g>

    <!-- 消息 1 -->
    <line x1="128" y1="195" x2="410" y2="195" stroke="#8ea3c4" stroke-width="1.4" marker-end="url(#arrowMuted)"/>
    <text x="270" y="187" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#cbd5e1">创建 issue 并 @agent</text>

    <!-- 消息 2 -->
    <line x1="428" y1="235" x2="710" y2="235" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrowCyan)"/>
    <text x="570" y="227" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#67e8f9">trigger</text>

    <!-- 消息 3：自处理 -->
    <path d="M720 265 h62 v22 h-62" fill="none" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#arrowViolet)"/>
    <text x="792" y="279" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#cbd5e1">评估请求，建立 ticket</text>

    <!-- 消息 4 -->
    <line x1="728" y1="315" x2="1010" y2="315" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#arrowViolet)"/>
    <text x="870" y="307" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#cbd5e1">派发任务（独立 worktree）</text>

    <!-- 消息 5：回写 GitHub -->
    <line class="dash" x1="1012" y1="355" x2="430" y2="355" stroke="#f472b6" stroke-width="1.4" marker-end="url(#arrowPink)"/>
    <text x="610" y="347" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#f9a8d4">推分支、开 PR、回复 issue</text>

    <!-- 消息 6：面板 -->
    <line class="dash" x1="712" y1="395" x2="128" y2="395" stroke="#22d3ee" stroke-width="1.2" marker-end="url(#arrowCyan)" opacity="0.75"/>
    <text x="430" y="387" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#a5f3fc">面板显示待处理事项</text>

    <!-- 底部注解 -->
    <text x="600" y="440" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6b7f9e">人只在两端出现：提需求、review；中间的评估、执行、交付由 agent 推进。</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="459" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
